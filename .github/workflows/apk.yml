name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Setup NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK="$(ls -d "$SDK"/ndk/* 2>/dev/null | tail -1 || true)"
          if [ -z "$NDK" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
            NDK="$SDK/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
      - name: Setup SDK platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null || true
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build APK
        run: cargo apk build --release --target aarch64-linux-android
      - name: Locate APK
        run: find . -name '*.apk' -print
      - uses: actions/upload-artifact@v4
        with:
          name: serch-client-apk
          path: '**/*.apk'
          
